[package]
name = "devez-cli"
version = "0.4.4"
edition = "2024"
license = "MIT"
description = "A stable, clean-room terminal client for the official Codex app-server"

[[bin]]
name = "devez"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
serde_json = "1.0"
textwrap = "0.16"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
