[package]
name = "devez-vibe"
version = "1.7.51"
edition = "2024"
license = "MIT"
description = "A stable terminal client for Codex and Claude Agent SDK"

[[bin]]
name = "dvz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "json",
    "rustls-tls",
] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
textwrap = "0.16"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-highlight = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Threading"] }
