[package]
name = "devez-cli"
version = "0.4.9"
edition = "2024"
license = "MIT"
description = "A stable, clean-room terminal client for the official Codex app-server"

[[bin]]
name = "dvz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "rustls-tls",
] }
serde_json = "1.0"
textwrap = "0.16"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
